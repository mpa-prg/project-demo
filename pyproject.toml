[project]
name = "project-demo"
version = "0.1.0"
description = "MPA-PRG semester projects: demo repository (replication origin from GC skew)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.88",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "D", "N", "I"]  # PEP 8, docstrings, names, imports

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
